{% extends 'base.html' %}

{% block title %}Contraseña actualizada - PassID{% endblock %}

{% block content %}
<div class="form-container">
    <div class="glass-card">
        <h1 class="form-title">Contraseña actualizada</h1>
        <p style="color: var(--text-muted);">
            Tu contraseña se cambió correctamente. Ya puedes iniciar sesión con ella.
        </p>
        <div class="btn-group">
            <a href="{% url 'autenticacion:login' %}" class="btn-submit" style="text-align: center;">
                Iniciar sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
