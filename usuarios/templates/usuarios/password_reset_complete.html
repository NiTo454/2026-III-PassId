{% extends 'base.html' %}

{% block title %}Contraseña actualizada | PassID{% endblock %}

{% block content %}
<section class="auth-page" aria-labelledby="password-reset-complete-title">
    <div class="glass-card auth-shell auth-feedback">
        <div class="auth-message-icon" aria-hidden="true">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <p class="auth-eyebrow">LISTO</p>
        <h1 class="form-title" id="password-reset-complete-title">Contraseña actualizada</h1>
        <p class="auth-description">Tu contraseña se cambió correctamente. Ya puedes iniciar sesión.</p>
        <div class="auth-action-row">
            <a href="{% url 'autenticacion:login' %}" class="btn-submit">
                Iniciar sesión
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </a>
        </div>
    </div>
</section>
{% endblock %}
