{% extends 'usuarios/base.html' %}

{% block title %}Eliminar Perfil - PassID{% endblock %}

{% block content %}
<div class="delete-container">
    <div class="glass-card">
        <i class="fa-solid fa-triangle-exclamation icon-warning"></i>
        <h1 class="delete-title">¿Eliminar Perfil / Rol?</h1>
        <p class="delete-desc">
            ¿Estás seguro de que deseas eliminar el perfil <strong>"{{ perfil.nombre }}"</strong>?
            Esta acción no se puede deshacer.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="btn-group">
                <a href="{% url 'usuarios:perfil_list' %}" class="btn-cancel">Cancelar</a>
                <button type="submit" class="btn-delete-confirm">Sí, Eliminar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
