{% extends 'base.html' %}

{% block title %}Enlace no válido - PassID{% endblock %}

{% block content %}
<div class="form-container">
    <div class="glass-card">
        <h1 class="form-title">Enlace no válido o vencido</h1>
        <p style="color: var(--text-muted);">
            Este enlace ya no se puede utilizar. Solicita uno nuevo para continuar.
        </p>
        <div class="btn-group">
            <a href="{% url 'usuarios:password_reset_request' %}" class="btn-submit" style="text-align: center;">
                Solicitar otro enlace
            </a>
        </div>
    </div>
</div>
{% endblock %}
