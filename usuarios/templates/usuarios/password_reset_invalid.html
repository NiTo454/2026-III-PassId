{% extends 'base.html' %}

{% block title %}Enlace no válido | PassID{% endblock %}

{% block content %}
<section class="auth-page" aria-labelledby="password-reset-invalid-title">
    <div class="glass-card auth-shell auth-feedback">
        <div class="auth-message-icon" aria-hidden="true">
            <i class="fa-solid fa-link-slash"></i>
        </div>
        <p class="auth-eyebrow">RECUPERACIÓN DE CUENTA</p>
        <h1 class="form-title" id="password-reset-invalid-title">Enlace no válido o vencido</h1>
        <p class="auth-description">
            Puede haber vencido o ya se utilizó. Solicita un nuevo enlace para continuar.
        </p>
        <div class="auth-action-row">
            <a href="{% url 'usuarios:password_reset_request' %}" class="btn-submit">
                Solicitar otro enlace
            </a>
            <a href="{% url 'autenticacion:login' %}" class="btn-cancel">
                Volver a iniciar sesión
            </a>
        </div>
    </div>
</section>
{% endblock %}
