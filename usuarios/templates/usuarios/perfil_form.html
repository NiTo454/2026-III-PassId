{% extends 'usuarios/base.html' %}

{% block title %}{{ title }} - PassID{% endblock %}

{% block content %}
<div class="form-container">
    <div class="glass-card">
        <h1 class="form-title">{{ title }}</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Asigna el nombre del perfil y selecciona los permisos deseados.</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">{{ form.nombre.label }}</label>
                {{ form.nombre }}
            </div>

            <div class="form-group">
                <label class="form-label">{{ form.permisos.label }}</label>
                <div class="checkbox-grid">
                    {% for checkbox in form.permisos %}
                    <label class="checkbox-item">
                        {{ checkbox.tag }} {{ checkbox.choice_label }}
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="btn-group">
                <a href="{% url 'usuarios:perfil_list' %}" class="btn-cancel">Cancelar</a>
                <button type="submit" class="btn-submit">{{ button_text }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
