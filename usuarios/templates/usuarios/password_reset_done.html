{% extends 'base.html' %}

{% block title %}Revisa tu correo | PassID{% endblock %}

{% block content %}
<section class="auth-page" aria-labelledby="password-reset-done-title">
    <div class="glass-card auth-shell auth-feedback">
        <div class="auth-message-icon" aria-hidden="true">
            <i class="fa-regular fa-envelope"></i>
        </div>
        <p class="auth-eyebrow">SIGUIENTE PASO</p>
        <h1 class="form-title" id="password-reset-done-title">Revisa tu correo</h1>
        <p class="auth-description">
            Si la información corresponde a una cuenta, recibirás instrucciones para restablecer tu contraseña.
        </p>
        <div class="auth-action-row">
            <a href="{% url 'autenticacion:login' %}" class="btn-submit">
                Volver a iniciar sesión
            </a>
        </div>
    </div>
</section>
{% endblock %}
