{% extends 'base.html' %}

{% block title %}Revisa tu correo - PassID{% endblock %}

{% block content %}
<div class="form-container">
    <div class="glass-card">
        <h1 class="form-title">Revisa tu correo</h1>
        <p style="color: var(--text-muted);">
            Si la información corresponde a una cuenta, recibirás instrucciones para restablecer tu contraseña.
        </p>
        <div class="btn-group">
            <a href="{% url 'autenticacion:login' %}" class="btn-submit" style="text-align: center;">
                Volver a iniciar sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
